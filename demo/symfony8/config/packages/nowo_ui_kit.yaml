# REQ-DEMO-014: UiKit's default theme, unchanged, with UiKit's own semantic stylesheet only (no CSS framework, no CDN).
# The panel pages render in the demo shell (base.html.twig extends UiKit's admin layout); the public 503 page and the
# login use UiKit's own guest layout.
nowo_ui_kit:
    css_framework: custom
    icon_set: none
    layouts:
        admin: 'base.html.twig'
