# Default package config (Symfony Flex recipe also ships a copy).
nowo_maintenance_mode:
    enabled: true
    default_message: 'We're making a few gentle improvements. Everything you care about is safe.'
    preview:
        # null = on when kernel.debug; set true/false to force
        enabled: ~
        path: '/_maintenance_preview'
    web_ui:
        enabled: true
        path_prefix: '/_maintenance'
        # Pages extend the UiKit scaffolds (REQ-UI-003): theme them once in nowo_ui_kit (layouts, theme).
        # layout_template: null        # null = nowo_ui_kit.layouts.admin
        # templates: { history: 'admin/maintenance_history.html.twig' }
        # history_limit: 100
        # history_per_page: 25
    security:
        password_protection: true
        # password_hash: '%env(MAINTENANCE_PASSWORD_HASH)%'
        # access_roles: [ROLE_ADMIN]
        # access_checker: null
        # allow_unauthenticated: false   # default; never true in production
    # exclusions:
    #     paths: ['/health']
    #     path_prefixes: ['/api/health']
    #     routes: []
    #     patterns: ['/_profiler*']
