maintenance.page.title: Une courte pause
maintenance.page.heading: Nous rangeons un peu — bientôt de retour
maintenance.page.message: Nous apportons quelques améliorations douces. Tout ce qui compte pour vous est en sécurité.
maintenance.page.badge: De retour très vite
maintenance.page.reassure: 'Aucune action n''est requise. Prenez un thé — nous rouvrirons bientôt.'
maintenance.page.thanks: Merci pour votre patience. Vous comptez pour nous.
maintenance.examples.bootstrap_calm.title: Respiration
maintenance.examples.bootstrap_calm.eyebrow: Pause douce
maintenance.examples.bootstrap_calm.heading: Un instant calme pendant que nous rafraîchissons le site
maintenance.examples.bootstrap_calm.message: Nous effectuons une maintenance légère pour que votre prochaine visite soit encore plus fluide.
maintenance.examples.bootstrap_calm.reassure: 'Vos données et votre compte sont intacts. C''est un soin de routine, pas une urgence.'
maintenance.examples.bootstrap_calm.thanks: 'Merci d''attendre avec bienveillance.'
maintenance.examples.bootstrap_sunset.title: Pause chaleureuse
maintenance.examples.bootstrap_sunset.eyebrow: Pause au soleil couchant
maintenance.examples.bootstrap_sunset.heading: Nous brillerons à nouveau dans un instant
