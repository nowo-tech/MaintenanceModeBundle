maintenance.examples.idea_countdown.reassure: Pode deixar este separador aberto — atualiza sozinho.
maintenance.examples.idea_countdown.thanks: Obrigado por ficar connosco.
maintenance.examples.idea_countdown.remaining: Tempo restante
maintenance.examples.idea_countdown.unknown_eta: Em breve
maintenance.examples.idea_updates.title: Atualizações em direto
maintenance.examples.idea_updates.eyebrow: Registo de estado
