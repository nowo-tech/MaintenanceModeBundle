maintenance.examples.idea_compassion.thanks: Obrigado pela compreensão.
maintenance.examples.idea_playful.title: Paragem técnica
maintenance.examples.idea_playful.eyebrow: Modo humor suave
maintenance.examples.idea_playful.heading: O site está a alongar-se um momento
maintenance.examples.idea_playful.message: Saímos para um polimento rápido. Sem drama — só uma pausa amigável.
maintenance.examples.idea_playful.punchline: Os servidores pediram um café. Dissemos que sim.
maintenance.examples.idea_playful.reassure: Tudo o que importa continua exatamente onde o deixou.
maintenance.examples.idea_playful.thanks: Obrigado por sorrir enquanto espera.
maintenance.examples.idea_brand.title: Manutenção
maintenance.examples.idea_brand.eyebrow: Aviso oficial
maintenance.examples.idea_brand.heading: Voltaremos em breve
maintenance.examples.idea_brand.message: Manutenção planeada para manter a experiência consistente e fiável.
maintenance.examples.idea_brand.reassure: Tente novamente dentro de momentos.
maintenance.examples.idea_brand.thanks: Agradecemos a sua paciência.
