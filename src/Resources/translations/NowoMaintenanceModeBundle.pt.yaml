maintenance.examples.idea_updates.message: A manutenção está ativa. Aqui está um resumo calmo do que acontece nos bastidores.
maintenance.examples.idea_updates.reassure: Não precisa de atualizar sem parar — reabriremos assim que for seguro.
maintenance.examples.idea_updates.thanks: Obrigado por permanecer connosco.
