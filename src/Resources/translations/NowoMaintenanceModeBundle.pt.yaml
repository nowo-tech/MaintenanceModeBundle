maintenance.page.title: Uma breve pausa
maintenance.page.heading: Estamos a organizar — voltamos em breve
maintenance.page.message: Estamos a fazer melhorias suaves. Tudo o que importa para si está seguro.
maintenance.page.badge: Voltamos já
maintenance.page.reassure: Não precisa de fazer nada. Tome um chá — reabriremos em breve.
maintenance.page.thanks: Obrigado pela paciência. É importante para nós.
maintenance.examples.bootstrap_calm.title: A respirar
maintenance.examples.bootstrap_calm.eyebrow: Pausa suave
maintenance.examples.bootstrap_calm.heading: Um momento calmo enquanto refrescamos o site
maintenance.examples.bootstrap_calm.message: Estamos a fazer manutenção ligeira para que a próxima visita seja ainda mais agradável.
maintenance.examples.bootstrap_calm.reassure: 'Os seus dados e conta estão intactos. É cuidado de rotina, não uma emergência.'
maintenance.examples.bootstrap_calm.thanks: Obrigado por esperar connosco com calma.
maintenance.examples.bootstrap_sunset.title: Pausa quente
maintenance.examples.bootstrap_sunset.eyebrow: Pausa ao pôr do sol
maintenance.examples.bootstrap_sunset.heading: Voltaremos a brilhar daqui a pouco
maintenance.examples.bootstrap_sunset.message: O site descansa para uma atualização breve. Nada está partido — só estamos a polir.
maintenance.examples.bootstrap_sunset.reassure: Pode fechar este separador e voltar mais tarde. Estaremos aqui para si.
maintenance.examples.bootstrap_sunset.thanks: Agradecemos a sua paciência serena.
maintenance.examples.foundation_garden.title: Pausa no jardim
maintenance.examples.foundation_garden.eyebrow: A crescer em silêncio
maintenance.examples.foundation_garden.heading: A plantar algumas melhorias
maintenance.examples.foundation_garden.message: Estamos a regar as raízes do site. Voltará a florir muito em breve.
maintenance.examples.foundation_garden.reassure: Nada do que fez causou isto. É cuidado planeado para manter tudo saudável.
maintenance.examples.foundation_garden.thanks: Obrigado por nos dar um momento para crescer.
maintenance.examples.foundation_night.title: Noite calma
maintenance.examples.foundation_night.eyebrow: Cuidado noturno
maintenance.examples.foundation_night.heading: As luzes estão baixas para uma atualização suave
maintenance.examples.foundation_night.message: Estamos a fazer manutenção silenciosa. Descanse — o seu lugar aqui está seguro.
maintenance.examples.foundation_night.reassure: 'Sem pressa, sem alarme. Voltaremos a acender as luzes em breve.'
maintenance.examples.foundation_night.thanks: Obrigado por confiar em nós durante a espera.
maintenance.examples.tailwind_breeze.title: Ar fresco
maintenance.examples.tailwind_breeze.eyebrow: Modo brisa
maintenance.examples.tailwind_breeze.heading: A abrir uma janela para atualizações frescas
maintenance.examples.tailwind_breeze.message: Uma brisa leve de manutenção percorre o site. Em breve sentirá-se mais claro.
maintenance.examples.tailwind_breeze.reassure: Pode relaxar. Nada urgente — estamos apenas a refrescar.
maintenance.examples.tailwind_breeze.thanks: Gratos pela sua paciência tranquila.
maintenance.examples.tailwind_aurora.title: Pausa aurora
maintenance.examples.tailwind_aurora.eyebrow: Aurora suave
maintenance.examples.tailwind_aurora.heading: Um brilho calmo enquanto melhoramos a experiência
maintenance.examples.tailwind_aurora.message: Estamos a afinar detalhes nos bastidores. A espera deve ser breve e sem stress.
maintenance.examples.tailwind_aurora.reassure: Tudo o que importa continua exatamente onde o deixou.
maintenance.examples.tailwind_aurora.thanks: Obrigado por permanecer gentis connosco.
maintenance.examples.idea_short.title: Voltamos já
maintenance.examples.idea_short.eyebrow: Pausa breve
maintenance.examples.idea_short.heading: De volta em breve
maintenance.examples.idea_short.message: Estamos a fazer uma atualização rápida. Nada com que se preocupar.
maintenance.examples.idea_short.reassure: Nenhuma ação necessária.
maintenance.examples.idea_short.thanks: Obrigado por esperar.
maintenance.examples.idea_compassion.title: Desculpe a pausa
maintenance.examples.idea_compassion.eyebrow: Com cuidado
maintenance.examples.idea_compassion.heading: Pedimos desculpa pelo incómodo
maintenance.examples.idea_compassion.message: Há manutenção em curso para manter tudo fiável. Sabemos que interrupções frustram.
maintenance.examples.idea_compassion.reassure: A sua conta e os seus dados estão seguros. Estamos a trabalhar com calma para reabrir.
